services:
  - type: web
    name: test-goreltech
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /skills
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: SKILLS_DIR
        value: skills
      - key: DEEPSEEK_API_KEY
        sync: false
